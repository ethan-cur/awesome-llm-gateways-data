markdown: >
  ## Overview


  CloseAI is an official-relay AI API station serving the Asia region. It
  positions itself as the largest enterprise-grade relay in Asia and issues
  enterprise invoices to customers.


  ## Features


  - Official-relay type station

  - Enterprise invoice issuance

  - Supports Alipay, WeChat, and Invoice payment

  - Active status verified as of 2026-05-26

  - Registered company entity publicly visible


  ## Pricing


  Paid service. Prices change frequently; verify on-site.


  ## Deployment


  Cloud-hosted relay service.
