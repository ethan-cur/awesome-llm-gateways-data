markdown: >-
  ## Overview


  Vertex AI Gateway is Google Cloud's managed API gateway for LLM workloads on
  Vertex AI, offering unified access to multiple foundation models including
  Gemini, with routing, caching, fallback, and cost management capabilities.


  ## Features


  - Managed cloud deployment on Google Cloud

  - Unified API for multiple foundation models

  - Request routing and load balancing

  - Response caching

  - Fallback and retry logic

  - Cost tracking and governance


  ## Pricing


  Usage-based pricing through Vertex AI and Google Cloud API Gateway. Free tier
  available; paid tiers scale with model usage and API calls.


  ## Deployment


  Cloud-hosted (Google Cloud)
