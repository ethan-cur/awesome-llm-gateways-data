markdown: >
  ## Overview


  BetterToken is an aggregator-type OpenAI- and Anthropic-compatible gateway for
  multiple model providers.


  ## Features


  - Aggregator-type gateway

  - OpenAI- and Anthropic-compatible (chat/completions, responses, messages)

  - Models: Claude, GPT, Gemini, DeepSeek, Kimi, GLM, MiniMax and Qwen

  - Prepaid pay-as-you-go pricing

  - Public pricing JSON at /api/pricing with each model's access-group ratio
  applied

  - Card payment accepted


  ## Pricing


  Paid service with prepaid pay-as-you-go pricing. Card payment accepted. Prices
  change frequently; verify on-site.


  ## Deployment


  Cloud-hosted aggregator service.
