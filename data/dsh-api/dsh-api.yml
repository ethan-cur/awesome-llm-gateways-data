markdown: >-
  ## Overview


  DSH API is a mixed-type AI API relay station offering OpenAI- and
  Anthropic-compatible gateway services for the China/Asia region.


  ## Features


  - Mixed-type relay station

  - OpenAI- and Anthropic-compatible gateway

  - QQ-mail registration

  - Alipay and WeChat payment support

  - Per-token billing


  ## Pricing


  Paid service with per-token billing. Prices change frequently; verify on-site.


  ## Deployment


  Cloud-hosted relay service.


  ## Trust Notes


  Status: unverified · ⚠ operator-self, no-entity. Listing does not constitute
  endorsement.
