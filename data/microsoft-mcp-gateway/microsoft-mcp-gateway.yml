markdown: >-
  ## Overview


  Microsoft MCP Gateway is a stateless reverse proxy and management layer for
  MCP servers on Kubernetes, with request routing, authorization, and server
  lifecycle management.


  ## Features


  - Stateless reverse proxy

  - Management layer for MCP servers on Kubernetes

  - Request routing

  - Authorization

  - Server lifecycle management


  ## License


  MIT


  ## Implementation Language


  C#


