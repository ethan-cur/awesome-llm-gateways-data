markdown: >-
  ## Overview


  Mintive is an MCP gateway and LLM gateway, formerly MintMCP, that gives each
  agent its own identity and governs access to models and tools by role.


  ## Features


  - MCP gateway

  - LLM gateway

  - Agent identity

  - Role-based access to models and tools


  ## Pricing Model


  Commercial pricing.


  ## Licensing


  Proprietary


