markdown: >-
  ## Overview


  LLM Gateway is a gateway and dashboard that routes requests to multiple LLM
  providers through one API. It keeps provider keys in one place and tracks
  token usage and cost.


  ## Features


  - Route requests to multiple LLM providers through one API

  - Keep provider keys in one place

  - Track token usage and cost

  - Dashboard for management


  ## License


  AGPL-3.0


  ## Implementation Language


  TypeScript


  ## Repository


  https://github.com/theopenco/llmgateway
