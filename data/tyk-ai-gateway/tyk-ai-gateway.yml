markdown: >-
  ## Overview


  Tyk AI Gateway extends Tyk's enterprise API gateway platform with AI-specific
  capabilities for managing LLM traffic. It provides routing, rate limiting,
  caching, and developer portal integration for AI workloads.


  ## Features


  - Enterprise API gateway

  - LLM traffic routing and management

  - Rate limiting and throttling

  - Response caching

  - Developer portal

  - Self-hosted and cloud deployment options

  - Plugin ecosystem


  ## Pricing


  Freemium model with open-source core (Tyk Open Source) and paid
  enterprise/self-managed and cloud tiers.


  ## Deployment


  Self-hosted and cloud-hosted
