markdown: >
  ## Overview


  APIClaw is an aggregator-type OpenAI-compatible gateway routing multiple model
  providers on a single key.


  ## Features


  - Aggregator-type gateway

  - OpenAI-compatible

  - Routes Anthropic, OpenAI, Gemini, DeepSeek and other providers

  - One key for multiple providers

  - Paid plans billed monthly in crypto

  - Crypto payment accepted


  ## Pricing


  Paid service with monthly crypto billing. Prices change frequently; verify
  on-site.


  ## Deployment


  Cloud-hosted aggregator service.
