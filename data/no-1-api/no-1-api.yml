markdown: >
  ## Overview


  No.1-API is an aggregator-type AI API relay station serving the China/Asia
  region. It provides one-stop aggregation and relay platform services for
  multiple LLM providers.


  ## Features


  - Aggregator-type relay station

  - One-stop aggregation and relay platform

  - Alipay and WeChat payment support

  - Active status verified as of 2026-05-26


  ## Pricing


  Paid service with local payment methods (Alipay/WeChat). Prices change
  frequently; verify on-site.


  ## Deployment


  Cloud-hosted relay service.
