markdown: >
  ## Overview


  Atlas Cloud is a multi-modal aggregator focused on image and video heavy
  models including Grok Imagine, Kling, ByteDance, and Vidu.


  ## Features


  - Multi-modal aggregator

  - Image/video heavy models (Grok Imagine, Kling, ByteDance, Vidu)

  - Public OpenAI-compatible /v1/models endpoint

  - Exposes per-token pricing including cache-read

  - Card payment accepted


  ## Pricing


  Paid service with card payment. Per-token pricing including cache-read exposed
  via /v1/models.


  ## Deployment


  Cloud-hosted aggregator service.
