markdown: >
  ## Overview


  UiUiAPI is an official-relay type AI API station serving the China/Asia
  region. It claims to provide official channels plus official multipliers,
  offering rare quantified discounts on LLM API access.


  ## Features


  - Official-relay type station

  - Public new-api /api/pricing endpoint on api1 subdomain

  - Claims official channels and official multipliers

  - Rare quantified discount pricing

  - Active status verified as of 2026-06-07


  ## Pricing


  Paid service with public pricing at /api/pricing. Prices change frequently;
  verify on-site.


  ## Deployment


  Cloud-hosted relay service.
