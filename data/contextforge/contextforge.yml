  ## Overview


  ContextForge is an IBM registry and proxy that federates MCP servers, A2A
  agents, and REST or gRPC APIs into one endpoint with central governance,
  discovery, and observability.


  ## Features


  - Federates MCP servers, A2A agents, and REST or gRPC APIs into one endpoint

  - Central governance

  - Discovery

  - Observability


