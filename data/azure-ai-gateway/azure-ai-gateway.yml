name: Azure AI Gateway
description: Microsoft Azure's managed AI gateway and API management layer for
  routing LLM workloads across Azure OpenAI and other model endpoints, with
  policy enforcement, caching, and cost tracking. Part of Azure's first-party
  cloud AI offerings.
